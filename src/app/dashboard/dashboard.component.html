<div class="container-fluid header-main">
  <div class="row">
    <div class="col-md-7">
      <div class="card">
        <div class="card-body">
          <h6 class="mb-3"><b>KPIs</b></h6>
          <div class="row">
            <div id="salesBorder" class="col d-flex align-items-center flex-column focus ms-3 mx-1">
              <p class="mt-2">VENTAS</p>
              <p>{{ balances.sales }}</p>
            </div>
            <div id="averageTicketBorder" class="col d-flex align-items-center flex-column focus mx-1">
              <p class="mt-2">TICKET MEDIO</p>
              <p>{{ ticketAverage }}</p>
            </div>
            <div id="refundsBorder" class="col d-flex align-items-center flex-column focus mx-1">
              <p class="mt-2">DEVOLUCIONES</p>
              <p>{{ balances.refunds }}</p>
            </div>
            <div id="casmovBorder" class="col d-flex align-items-center flex-column focus mx-1">
              <p class="mt-2">MOV. CAJA</p>
              <p>{{ balances.salesCount + balances.refundsCount }}</p>
            </div>
            <div id="balanceBorder" class="col d-flex align-items-center flex-column focus me-3 mx-1">
              <p class="mt-2">RESULTADO</p>
              <p>{{ balances.sales - balances.refunds }}</p>
            </div>
          </div>
          <div>
            <h6 class="mt-3"><b>Evolución KPI</b></h6>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-5">
      <div class="card">
        <div class="card-body">
          <div class="">
            <h6><b>TOP 3 más vendidos</b></h6>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="">
            <h6><b>Métodos de pago</b></h6>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
