<div class="modal" *ngIf="showModal">
  <div class="modal-info-content">
    <div class="modal-header">
      <h2>{{ modalTitle }}</h2>
      <button class="modal-close-button" (click)="close()">×</button>
    </div>
    <div class="modal-body">
      <div class="container my-3">
        <div class="row mb-3">
          <div class="col-md-12">
            <div class="row">
              <div class="col-12">
                {{ modalMessage }}
              </div>
            </div>
          </div>
      </div>
    </div>
  </div>
</div>
