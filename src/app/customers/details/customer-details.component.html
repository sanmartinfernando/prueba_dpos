<div class="container-fluid header-main mt-4">
  <div class="d-flex justify-content-between mb-2">
    <a [routerLink]="['/customers']" type="button" class="" style="text-decoration: none;">
      <i class="fa-solid fa-angle-left"></i> {{'dpos.customers.page.back' | translate}}
    </a>
  </div>
  <!-- Load -->
  <div *ngIf="!loadCompleted" class="d-flex justify-content-center">
    <div class="spinner-border text-danger"></div>
  </div>
  <!-- Detalles -->
  <form>
    <div class="row g-3">
      <!-- Columna izquierda -->
      <div class="col-md-6">
        <div class="mb-3">
          <label for="nif" class="form-label">{{'dpos.customers.nif.column' | translate}}</label>
          <input type="text" class="form-control" id="nif" />
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">{{'dpos.customers.name.column' | translate}}</label>
          <input type="text" class="form-control" id="nombre" />
        </div>
        <div class="mb-3">
          <label for="lastname" class="form-label">{{'dpos.customers.lastname.column' | translate}}</label>
          <input type="text" class="form-control" id="apellidos" />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">{{'dpos.customers.email.column' | translate}}</label>
          <input type="email" class="form-control" id="email" />
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">{{'dpos.customers.phone.column' | translate}}</label>
          <input type="text" class="form-control" id="telefono" />
        </div>
      </div>
      <!-- Columna derecha -->
      <div class="col-md-6">
        <div class="mb-3">
          <label for="address" class="form-label">{{'dpos.customers.address.column' | translate}}</label>
          <input type="text" class="form-control" id="direccion" />
        </div>
        <div class="mb-3">
          <label for="city" class="form-label">{{'dpos.customers.city.column' | translate}}</label>
          <input type="text" class="form-control" id="ciudad" />
        </div>
        <div class="mb-3">
          <label for="postcode" class="form-label">{{'dpos.customers.postcode.column' | translate}}</label>
          <input type="text" class="form-control" id="cp" />
        </div>
        <div class="mb-3">
          <label for="country" class="form-label">{{'dpos.customers.country.column' | translate}}</label>
          <input type="text" class="form-control" id="provincia" />
        </div>
        <div class="mb-3">
          <label for="state" class="form-label">{{'dpos.customers.state.column' | translate}}</label>
          <input type="text" class="form-control" id="pais" />
        </div>
      </div>
    </div>
    <!-- Botones -->
    <div class="d-flex justify-content-end mt-4">
      <a [routerLink]="['/customers']" type="button" class="" style="text-decoration: none;">
        <button type="button" class="btn btn-outline-danger me-2">{{'dpos.action.cancel' | translate}}</button>
      </a>
      <button type="submit" class="btn btn-primary">{{'dpos.action.save' | translate}}</button>
    </div>
  </form>
</div>
