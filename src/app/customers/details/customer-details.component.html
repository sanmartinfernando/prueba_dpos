<div class="container-fluid header-main mt-4">
  <div class="d-flex justify-content-between mb-2">
    <a [routerLink]="['/customers']" type="button" style="text-decoration: none;">
      <i class="fa-solid fa-angle-left"></i> {{ 'dpos.customers.page.back' | translate }}
    </a>
  </div>
  <div class="card my-4">
    <div class="card-body">
      <div *ngIf="!loadCompleted" class="d-flex justify-content-center">
        <div class="spinner-border text-danger"></div>
      </div>
      <div class="col mb-4">
        <h5><b>{{ titlePage }}</b></h5>
      </div>
      <div class="row">
        <div class="col">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="identityDocument" class="form-label">{{ 'dpos.customers.nif.column' | translate }}</label>
                  <input type="text" class="form-control" id="identityDocument" [(ngModel)]="identityDocument" name="identityDocument" />
                </div>
                <div class="mb-3">
                  <label for="name" class="form-label">{{ 'dpos.customers.name.column' | translate }}</label>
                  <input type="text" class="form-control" id="name" [(ngModel)]="name" name="name" />
                </div>
                <div class="mb-3">
                  <label for="lastname" class="form-label">{{ 'dpos.customers.lastname.column' | translate }}</label>
                  <input type="text" class="form-control" id="lastname" [(ngModel)]="lastname" name="lastname" />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">{{ 'dpos.customers.email.column' | translate }}</label>
                  <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" />
                </div>
                <div class="mb-3">
                  <label for="phone" class="form-label">{{ 'dpos.customers.phone.column' | translate }}</label>
                  <input type="text" class="form-control" id="phone" [(ngModel)]="phone" name="phone" />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="address" class="form-label">{{ 'dpos.customers.address.column' | translate }}</label>
                  <input type="text" class="form-control" id="address" [(ngModel)]="address" name="address" />
                </div>
                <div class="mb-3">
                  <label for="city" class="form-label">{{ 'dpos.customers.city.column' | translate }}</label>
                  <input type="text" class="form-control" id="city" [(ngModel)]="city" name="city" />
                </div>
                <div class="mb-3">
                  <label for="postcode" class="form-label">{{ 'dpos.customers.postcode.column' | translate }}</label>
                  <input type="text" class="form-control" id="postcode" [(ngModel)]="postcode" name="postcode" />
                </div>
                <div class="mb-3">
                  <label for="country" class="form-label">{{ 'dpos.customers.country.column' | translate }}</label>
                  <input type="text" class="form-control" id="country" [(ngModel)]="country" name="country" />
                </div>
                <div class="mb-3">
                  <label for="state" class="form-label">{{ 'dpos.customers.state.column' | translate }}</label>
                  <input type="text" class="form-control" id="state" [(ngModel)]="state" name="state" />
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-end mt-4">
              <a [routerLink]="['/customers']" type="button" style="text-decoration: none;">
                <button type="button" class="btn btn-outline-danger me-2">{{ 'dpos.action.cancel' | translate }}</button>
              </a>
              <button type="submit" class="btn btn-primary" [routerLink]="code" (click)="saveCustomer()">{{'dpos.action.save' | translate}}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
