<div class="container mt-5 col-md-6 offset-md-3">
  <div class="card">
    <div id="cardheader" class="card-header card-header-customer">
      <h4 class="card-title">Recuperación de contraseña</h4>
    </div>
    <form>
      <div class="form-group my-3 ms-5 me-5">
        <h6>Introduzca sus datos de usuario</h6>
      </div>
      <!-- <div class="form-group my-2 ms-5 me-5">
        <label class="mb-2" for="username"> Usuario</label>
        <input
          type="username"
          class="form-control"
          [(ngModel)]="userLocal"
          name="user"
        />
      </div> -->
      <div class="form-group my-2 ms-5 me-5">
        <label class="mb-2"> Nueva contraseña</label>
        <input
          type="username"
          class="form-control"
          [(ngModel)]="userPassword"
          name="pw"
        />
      </div>
      <div class="form-group my-2 ms-5 me-5">
        <label class="mb-2"> Confirmar contraseña</label>
        <input
          type="username"
          class="form-control"
          [(ngModel)]="userConfirmPassword"
          name="confirmpw"
        />
        <div class="mt-3" *ngIf="error.length==0 && counter==0">
          <span class="text-success">
            Contraseña cambiada correctamente, compruebe el correo asociado a la cuenta.
          </span>
        </div>
        <div class="mt-3" *ngFor="let error of error">
          <span class="text-danger">
            {{error}}
          </span>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn button" (click)="resetPW()">
            Aceptar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
