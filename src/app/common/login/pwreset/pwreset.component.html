<div class="container mt-5 col-md-6 offset-md-3">
  <div class="card p-5">
    <h4 class="card-title">{{ 'dpos.pwreset.password.reset.title' | translate }}</h4>
    <form>
      <div class="form-group my-3 ms-5 me-5">
        <h6>{{ 'dpos.pwreset.username.label' | translate }}</h6>
      </div>
      <div class="form-group my-2 ms-5 me-5">
        <label class="mb-2" for="pw">{{ 'dpos.pwreset.newpassword.label' | translate }}</label>
        <input type="password" class="form-control" [(ngModel)]="userPassword" name="pw" id="pw" />
      </div>
      <div class="form-group my-2 ms-5 me-5">
        <label class="mb-2" for="confirmpw">{{ 'dpos.pwreset.confirmpassword.label' | translate }}</label>
        <input type="password" class="form-control" [(ngModel)]="userConfirmPassword" name="confirmpw" id="confirmpw" />
        <div class="mt-3" *ngIf="errorMessages.length === 0 && errorCounter === 0">
          <span class="text-success">{{ 'dpos.pwreset.passwordchanged.label' | translate }}</span>
        </div>
        <div class="mt-3" *ngFor="let error of errorMessages">
          <span class="text-danger">{{ error }}</span>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn button" (click)="resetPW()">
            {{ 'dpos.action.accept' | translate }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
