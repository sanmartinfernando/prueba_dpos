<div class="container mt-5 col-md-3 offset-md-5">
  <div class="card p-5">
    <h2><b>Welcome back!</b></h2>
    <span>Enter your account details</span>
    <div class="mt-3">
      <form *ngIf="!isLoggedIn" [formGroup]="loginForm" (ngSubmit)="loginForm.valid && onSubmit()" novalidate>
        <div class="my-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="username" class="form-control" formControlName="username" />
          <div *ngIf="loginForm.value.username.errors && loginForm.submitted" class="invalid-feedback">
            Username is required!
          </div>
        </div>
        <!--<div class="input-group">
          <input type="text" class="form-control" id="since">
          <button class="btn btn-light btn-input" type="button"><i class='fas fa-user'></i></button>
        </div><br>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username"
            aria-describedby="basic-addon2">
          <span class="input-group-text" id="basic-addon2">a</span>
        </div>-->
        <div class="my-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" matInput class="form-control" placeholder="" formControlName="pw" minlength="4" />
          <div style="padding: 5px;">
            <a [routerLink]="code"><small>¿Has olvidado la contraseña?</small></a>
          </div>
          <div *ngIf="loginForm.value.pw.errors && loginForm.submitted" class="invalid-feedback">
            <div *ngIf="loginForm.value.pw.errors['required']">
              Password is required
            </div>
            <div *ngIf="loginForm.value.pw.errors['minlength']">
              Password must be at least 4 characters
            </div>
          </div>
        </div>
        <div class="my-3 text-center">
          <button [disabled]="!loginForm.valid" type="submit" class="btn button">
            Iniciar sesión
          </button>
        </div>
        <div *ngIf="isLoginFailed" class="alert alert-danger" role="alert">
          Login failed: {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
