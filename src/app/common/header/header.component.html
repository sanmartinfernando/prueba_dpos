<div class="d-md-none d-flex justify-content-end px-3">
  <button class="btn btn-dark toggle-nav-btn" (click)="toggleNav()">
    <i class="fa fa-bars fa-lg"></i>
  </button>
</div>
<ng-template class="d-flex justify-content-center" #spinner>
  <div class="spinner-border text-danger"></div>
</ng-template>
<nav class="sidenav vh-100 d-flex flex-column overflow-auto"
  [ngClass]="{ 'd-none': !showNav, 'd-flex': showNav, 'd-md-flex': true }">
  <div class="logo flex-shrink-0 p-2 text-white text-center">
    <a class="d-flex align-items-center justify-content-center text-white text-decoration-none" (click)="getTitle()" routerLink="/dashboard">
      <ng-container *ngIf="logoLoaded; else spinner">
        <ng-container *ngIf="!isComercia">
          <i class="fa-solid fa-box py-2 logo"></i>
        </ng-container>
        <ng-container *ngIf="isComercia">
          <img src="assets/img/logo-lacaixa.png" alt="Logotipo La Caixa" class="logoLaCaixa">
        </ng-container>
      </ng-container>
    </a>
  </div>
  <div id="navBar1" class="flex-shrink-0">
    <ul id="navBarMain" class="navbar-nav flex-column align-items-center align-items-md-stretch w-100">
      <ng-container>
        <li *ngFor="let page of pages" class="nav-item w-100">
          <a class="nav-link m-3 d-flex flex-column align-items-center" (click)="handlePageClick(page.text, page.code)" routerLink="/{{ page.code }}" routerLinkActive="active-link">
            <i class="{{ page.icon }} active-icon-link fa-2xl mt-3"></i>{{ page.text }}
          </a>
        </li>
      </ng-container>
    </ul>
  </div>
</nav>
<header class="bg-customer">
  <div class="clearfix header-main container-fluid py-2">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
      <ng-container *ngIf="logoLoaded; else spinner">
        <h3 class="float-start p-3 pb-2 mb-0"><b>{{ title }}</b></h3>
      </ng-container>
      <ul class="navbar-nav d-flex flex-column flex-md-row align-items-start align-items-md-center ms-md-auto px-3 gap-2">
        <li class="mx-3 nav-item pt-2 pb-2">
          <app-dpos-lang-switcher></app-dpos-lang-switcher>
        </li>
        <li class="mx-3 nav-item pt-2 pb-2 w-100 w-md-auto">
          <select [disabled]="!formSelectEnabled" class="form-select-commerce responsive-input" id="searchCommerce" name="commerce" [(ngModel)]="commerceSelected" (change)="onCommerceChange()" *ngIf="username; else loginLink">
            <option *ngFor="let commerce of commerces" [value]="commerce.commerceId">
              {{ commerce.commerceNumber + ' - ' + commerce.resellerName }}
            </option>
          </select>
        </li>
        <li class="mx-3 nav-item pt-2 pb-2 w-100 w-md-auto">
          <button class="btn btn-light d-flex align-items-center gap-2 responsive-button" *ngIf="username" (click)="logOut()" style="cursor: pointer">
            <i class="fa-solid fa-circle-user fa-lg" style="color: #ffbb00;"></i>
            <span>{{ username }}</span>
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </li>
        <ng-template #loginLink>
          <li class="mx-3 nav-item pt-2 pb-2">
            <a class="btn" routerLink="/login">{{ 'dpos.login.btn' | translate }}</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</header>
