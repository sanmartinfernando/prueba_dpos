<nav class="sidenav d-flex flex-column vh-100">
  <div class="flex-shrink-0 p-2 text-white bg-customer1">
    <a
      class="d-flex align-items-center justify-content-center mb-0 text-white text-decoration-none"
      (click)="titleHeader(title0)"
      routerLink="/"
    >
      <!--{{'webTitle' | translate}}-->
      <i
        class="fa-solid fa-cash-register py-2"
        style="color: #ffffff; font-size: 75px"
      ></i>
    </a>
  </div>
  <div id="navBar1" class="flex-shrink-0 bg-white">
    <ul id="navBarMain" class="navbar-nav flex-column align-items-stretch">
      <ng-container  >
      <li *ngFor="let page of pages">
        <a
          class="nav-link m-3 pt-4 d-flex flex-column align-items-center"
          (click)="titleHeader(page.text)"
          routerLink="/{{ page.code }}"
          routerLinkActive="active-link"
          (click)="component(page.code)"
        >
          <i class="{{ page.icon }}  fa-2xl MT-3"></i><br />{{
            page.text | translate
          }}
        </a>
      </li>
    </ng-container>
    </ul>
  </div>
</nav>
<header class="bg-customer1">
  <div class="clearfix header-main">
    <h6 class="float-start text-white pt-3 pb-2">{{ title }}</h6>
    <ul class="navbar-nav float-end">
      <li class="mx-3 nav-item text-white pt-2 pb-2">
        <a
          class="nav-link"
          *ngIf="username; else loginLink"
          (click)="logOut()"
          style="cursor: pointer"
          ><span class="fa-solid fa-lg fa-right-from-bracket"></span>&nbsp;{{
            username
          }}</a
        >
      </li>
      <ng-template #loginLink>
        <li class="mx-3 nav-item">
          <a class="nav-link" routerLink="/login"
            ><span class="fas fa-lg fa-sign-in-alt"></span>&nbsp;Login</a
          >
        </li>
      </ng-template>
    </ul>
  </div>
</header>
