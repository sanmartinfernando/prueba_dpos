<nav class="sidenav d-flex flex-column vh-100" style="background-color: #313131;">
  <div class="flex-shrink-0 p-2 text-white">
    <a class="d-flex align-items-center justify-content-center mb-0 text-white text-decoration-none"
      (click)="titleHeader(title0)" routerLink="/">
      <!--{{'webTitle' | translate}}-->
      <!--<i class="fa-solid fa-cash-register py-2" style="color: #ffffff; font-size: 40px"></i>-->
      <h2 style="font-family:Roboto">DPOS</h2>
    </a>
  </div>
  <div id="navBar1" class="flex-shrink-0">
    <ul id="navBarMain" class="navbar-nav flex-column align-items-stretch">
      <li *ngFor="let page of pages">
        <a class="nav-link m-3 pt-4 d-flex flex-column align-items-center" (click)="titleHeader(page.text)"
          routerLink="/{{ page.code }}" routerLinkActive="active-link" (click)="component(page.code)">
          <i class="{{ page.icon }}  fa-2xl MT-3"></i><br />{{
          page.text | translate
          }}
        </a>
      </li>
    </ul>
  </div>
</nav>
<header class="bg-customer" style="border-bottom:2px solid #ededed;">
  <div class="clearfix header-main">
    <h2 class="float-start text-white pt-3 pb-2">{{ title }}</h2>
    <ul class="navbar-nav float-end">
      <li class="mx-3 nav-item pt-2 pb-2">
        <a class="nav-link" *ngIf="username; else loginLink" (click)="logOut()" style="cursor: pointer"><i class="fa-solid fa-circle-user"></i>&nbsp;&nbsp;{{
          username
          }}&nbsp;&nbsp;<span
            class="fa-solid fa-arrow-right-from-bracket"></span></a>
      </li>
      <ng-template #loginLink>
        <li class="mx-3 nav-item">
          <a class="nav-link" routerLink="/login"><span class="fas fa-lg fa-sign-in-alt"></span>&nbsp;Login</a>
        </li>
      </ng-template>
    </ul>
  </div>
</header>
