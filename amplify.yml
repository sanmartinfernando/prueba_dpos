
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Lógica condicional: si la rama es 'main' (o 'master'), ejecuta 'build:prod',
        # de lo contrario, ejecuta 'build:inte'.
        - |
          if [ "$AWS_BRANCH" == "main" ]; then
            npm run build:prod
          else
            npm run build:inte
          fi
  artifacts:
    baseDirectory: /dist/diu.pos.webc.angular/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*